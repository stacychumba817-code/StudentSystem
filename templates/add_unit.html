{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add New Unit</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="code" class="form-label">Unit Code</label>
                    <input type="text" class="form-control" id="code" name="code" required placeholder="e.g., CS101">
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Unit Name</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Introduction to Programming">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Add Unit</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
