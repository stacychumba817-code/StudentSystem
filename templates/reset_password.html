<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Reset Password for {{ reg_no }}</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="new_password" class="form-label">New Password</label>
            <input type="text" class="form-control" id="new_password" name="new_password" required minlength="4">
            <div class="form-text">Minimum 4 characters.</div>
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
        <a href="{{ url_for('view_students') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
