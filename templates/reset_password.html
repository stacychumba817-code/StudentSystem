{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning">
                    <h4 class="mb-0">Reset Password for {{ reg_no }}</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <!-- The 'name="new_password"' attribute is CRITICAL here -->
                            <input type="text" class="form-control" id="new_password" name="new_password" required>
                            <div class="form-text text-muted">Enter the new password for this user.</div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning">Reset Password</button>
                            <a href="{{ url_for('view_students') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
