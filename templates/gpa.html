{% extends "base.html" %}
{% block title %}View GPA{% endblock %}

{% block content %}
<h2>View GPA</h2>
<form method="POST">
    <div class="mb-3">
        <label for="reg_no" class="form-label">Registration Number</label>
        <input type="text" class="form-control" id="reg_no" name="reg_no" required>
    </div>
    <button type="submit" class="btn btn-info">Show GPA</button>
</form>

{% if result %}
    <div class="mt-4 alert alert-success">{{ result }}</div>
{% endif %}
{% endblock %}
