{% extends "base.html" %}

{% block title %}Remove Student{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-user-minus"></i> Remove Student</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="reg_no" class="form-label">Select Student</label>
                            <select class="form-select" name="reg_no" id="reg_no" required>
                                <option value="" disabled selected>-- Choose a student --</option>
                                {% for reg, student in students.items() %}
                                    <option value="{{ reg }}">{{ reg }} - {{ student.name }}</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Select the student you want to remove from the system.</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to remove this student? This action cannot be undone.');">
                                <i class="fas fa-trash"></i> Remove Student
                            </button>
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
