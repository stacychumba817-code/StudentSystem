{% extends "base.html" %}
{% block content %}
<h2>Add Marks</h2>
<form method="POST">
    <div class="mb-3">
        <label for="reg_no" class="form-label">Registration Number</label>
        <input type="text" class="form-control" id="reg_no" name="reg_no" required>
    </div>
    <div class="mb-3">
        <label for="unit" class="form-label">Unit Name</label>
        <input type="text" class="form-control" id="unit" name="unit" required>
    </div>
    <div class="mb-3">
        <label for="marks" class="form-label">Marks (numeric)</label>
        <input type="text" class="form-control" id="marks" name="marks" required>
    </div>
    <button type="submit" class="btn btn-success">Add Marks</button>
</form>
{% endblock %}
