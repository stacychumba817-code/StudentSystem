{% extends "base.html" %}
{% block title %}Add Marks{% endblock %}

{% block content %}
<h2>Add Marks</h2>
<form method="POST">
    <div class="mb-3">
        <label for="reg_no" class="form-label">Registration Number</label>
        <input type="text" class="form-control" id="reg_no" name="reg_no" required>
    </div>
    <div class="mb-3">
        <label for="unit" class="form-label">Unit / Subject</label>
        <input type="text" class="form-control" id="unit" name="unit" required placeholder="e.g., Mathematics">
    </div>
    <div class="mb-3">
        <label for="marks" class="form-label">Marks (0–100)</label>
        <input type="number" class="form-control" id="marks" name="marks" step="1" required min="0" max="100" step="0.01">
    </div>
    <button type="submit" class="btn btn-primary">Add Marks</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
